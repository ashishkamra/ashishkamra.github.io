<section class="section repositories-section" id="repositories">
  <div class="container">
    <div class="section-title-row">
      <div>
        <p class="section-kicker">02 / Open source</p>
        <h2>Selected repositories</h2>
      </div>
      <a class="text-link" href="https://github.com/ashishkamra?tab=repositories" target="_blank" rel="noopener">View all on GitHub <span aria-hidden="true">↗</span></a>
    </div>
    <div class="repo-grid">
      {% for repo in site.data.repositories %}
      <a class="repo-card" href="{{ repo.url }}" target="_blank" rel="noopener">
        <div class="repo-number">0{{ forloop.index }}</div>
        <div class="repo-content">
          <p class="repo-focus">{{ repo.focus }}</p>
          <h3>{{ repo.name }} <span aria-hidden="true">↗</span></h3>
          <p>{{ repo.description }}</p>
          <span class="repo-language"><i></i>{{ repo.language }}</span>
        </div>
      </a>
      {% endfor %}
    </div>
  </div>
</section>
