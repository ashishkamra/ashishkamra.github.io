<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{{ page.title | default: site.title }}</title>
  <meta name="description" content="{{ page.description | default: site.description }}">
  <link rel="stylesheet" href="{{ '/assets/css/style.css' | relative_url }}">
  {% seo %}
</head>
<body>
  <header class="site-header">
    <div class="container">
      <div class="header-content">
        <a href="{{ '/' | relative_url }}" class="site-brand" aria-label="Ashish Kamra, home">
          <span class="brand-mark">AK</span>
          <span><strong>Ashish Kamra</strong><small>Public profile</small></span>
        </a>
        <nav class="site-nav" aria-label="Primary navigation">
          <a href="#about">Bio</a>
          <a href="#repositories">Repos</a>
          <a href="#patents">Patents</a>
          <a href="#resume">Resume</a>
          <a href="https://www.linkedin.com/in/ashishkamra/" class="nav-linkedin" target="_blank" rel="noopener">LinkedIn <span aria-hidden="true">↗</span></a>
        </nav>
      </div>
    </div>
  </header>

  <main>
    {{ content }}
  </main>

  <footer class="site-footer">
    <div class="container">
      <div class="footer-content">
        <p><strong>Ashish Kamra</strong><br>Engineering leadership for AI systems at scale.</p>
        <div class="footer-links">
          <a href="https://github.com/ashishkamra" target="_blank" rel="noopener">GitHub</a>
          <a href="https://www.linkedin.com/in/ashishkamra/" target="_blank" rel="noopener">LinkedIn</a>
          <a href="https://scholar.google.com/citations?user=Fn_hlBoAAAAJ&hl=en" target="_blank" rel="noopener">Google Scholar</a>
        </div>
      </div>
    </div>
  </footer>
</body>
</html>
